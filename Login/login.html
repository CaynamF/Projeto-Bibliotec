<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="../imgs/Icone - Bibliotec.png" type="image/x-icon">
</head>

<body>
    <header class="cabecalho">
        <a href="#">
            <img src="../imgs/Logo Horizontal - branca.svg" alt="Logo do sistema Bibliotec." />
        </a>
        <nav class="navegacao">
            <a href="../Home/home.html">Home</a>
        </nav>
    </header>
    <main>
        <section class="login">
            <img src="../imgs/Icone - Bibliotec.png" alt="">
            <h1>Bem-vindo(a) à Biblio Tec</h1>
            <p>Acesse sua conta para continuar</p>
            <form action="">
                <div class="e-mail">
                    <label for="e-mail">E-mail</label>
                    <input type="email" placeholder="email@alunosenai.com">
                </div>
                <div class="senha">
                    <label for="senha">Senha</label>
                    <input type="password" placeholder="*******">
                </div>

                <div class="botoes">
                    <a href="" class="entrar">entrar</a>
                    <a href="" class="google">
                        <img src="../imgs/flat-color-icons_google.svg" alt=""> Continuar com Google
                    </a>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
